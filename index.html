<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amsterdam Trip</title>
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1d22; --muted:#666b75; --line:#e3e1dc;
  --accent:#e2572b; --bar:#c2410c; --food:#15803d; --party:#7c3aed; --visit:#1d4ed8; --done:#9aa0a8;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --chip:#efede8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --panel:#1a1d23; --ink:#eceae6; --muted:#9a9fa8; --line:#2a2e36;
    --bar:#fb923c; --food:#4ade80; --party:#a78bfa; --visit:#60a5fa; --done:#5b616b;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#252932;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#1a1d23; --ink:#eceae6; --muted:#9a9fa8; --line:#2a2e36;
  --bar:#fb923c; --food:#4ade80; --party:#a78bfa; --visit:#60a5fa; --done:#5b616b;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#252932;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
#progress{font-size:13px;color:var(--muted)}
#gpsBtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
#gpsBtn.on{background:var(--ok);color:#fff;border-color:transparent}
main{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 24px;display:none;background:var(--bg)}
.view.active{display:block}
#mapView{display:none}
#mapView.active{display:block;padding:0}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.active{color:var(--accent);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px}
.filters button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:10px}
.card.done{opacity:.55}
.card .body{flex:1;min-width:0}
.card h3{margin:0 0 2px;font-size:15px}
.card .meta{font-size:12px;color:var(--muted)}
.card .price{font-weight:600;font-size:14px;margin:4px 0}
.card .why{font-size:13px;margin:4px 0}
.card .links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.card a{color:var(--visit)}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:16px;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.conf{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;margin-left:4px}
.conf.s{color:var(--ok)} .conf.p{color:var(--warn)} .conf.v{color:var(--bad)}
h2{font-size:15px;margin:16px 0 4px}
h2:first-child{margin-top:0}
.legend{position:absolute;z-index:500;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px}
.mapfilters{position:absolute;z-index:500;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto}
.mapfilters button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mapfilters button.active{background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:1000;display:none;max-width:90vw;text-align:center}
.leaflet-popup-content{font-size:13px;margin:10px 12px}
.leaflet-popup-content h4{margin:0 0 4px;font-size:14px}
.popbtn{margin-top:6px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.settings label{display:block;margin:10px 0 4px;font-size:14px}
.settings select,.settings button{font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Amsterdam · 27→30 oct.</h1>
    <span id="progress"></span>
    <button id="gpsBtn" type="button">📍 GPS</button>
  </header>
  <main>
    <section id="mapView" class="view active">
      <div id="map"></div>
      <div class="mapfilters" id="mapFilters"></div>
      <div class="legend" id="gpsInfo">GPS arrêté</div>
    </section>
    <section id="barsView" class="view"></section>
    <section id="foodView" class="view"></section>
    <section id="partyView" class="view"></section>
    <section id="visitView" class="view"></section>
    <section id="daysView" class="view"></section>
  </main>
  <nav id="tabs">
    <button data-v="mapView" class="active"><span>🗺️</span>Carte</button>
    <button data-v="barsView"><span>🍺</span>Bars</button>
    <button data-v="foodView"><span>🍟</span>Manger</button>
    <button data-v="partyView"><span>🎉</span>Soirées</button>
    <button data-v="visitView"><span>🏛️</span>Visites</button>
    <button data-v="daysView"><span>📅</span>Jours</button>
  </nav>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
const CAT = {
  bar:   { label: "Bars",    icon: "🍺", color: "--bar" },
  food:  { label: "Manger",  icon: "🍟", color: "--food" },
  party: { label: "Soirées", icon: "🎉", color: "--party" },
  visit: { label: "Visites", icon: "🏛️", color: "--visit" },
};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── État local (par téléphone) ──
const KEY = "ams-trip-v1";
let state = { checked: {}, radius: 40, dwell: 60, mapCat: "all", dayFilter: "all" };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

// ── Géométrie ──
function dist(aLat, aLon, bLat, bLon) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (bLat - aLat) * r, dLon = (bLon - aLon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
let me = null; // {lat, lon, acc}
function from() { return me || BASE; }
function distTxt(p) {
  if (p.lat == null) return "";
  const f = from(), d = dist(f.lat, f.lon, p.lat, p.lon);
  const min = Math.round(d / 80);
  const txt = d < 1000 ? Math.round(d) + " m" : (d / 1000).toFixed(1).replace(".", ",") + " km";
  return `${txt} · ${min} min à pied ${me ? "d'ici" : "de chez vous"}`;
}
const byDist = (a, b) => {
  const f = from();
  const da = a.lat == null ? 1e9 : dist(f.lat, f.lon, a.lat, a.lon);
  const db = b.lat == null ? 1e9 : dist(f.lat, f.lon, b.lat, b.lon);
  return da - db;
};

// ── Coche ──
function isDone(id) { return !!state.checked[id]; }
function toggle(id, val) {
  if (val ?? !isDone(id)) state.checked[id] = Date.now(); else delete state.checked[id];
  save(); renderAll();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3500);
}

// ── Carte ──
const map = L.map("map", { zoomControl: false }).setView([BASE.lat, BASE.lon], 14);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
L.marker([BASE.lat, BASE.lon], {
  icon: L.divIcon({ className: "", html: '<div style="font-size:24px;line-height:24px">🏠</div>', iconSize: [24, 24], iconAnchor: [12, 12] })
}).addTo(map).bindPopup("<h4>Chez vous</h4>Warmoesstraat 129");

const markers = {};
let meMarker = null, meCircle = null;
function popupHtml(p) {
  return `<h4>${CAT[p.cat].icon} ${esc(p.name)}</h4>
    <div>${esc(p.addr || "")}${p.approx ? " (position approx.)" : ""}</div>
    ${p.priceTxt ? `<div><b>${esc(p.priceTxt)}</b></div>` : ""}
    ${p.hours ? `<div>${esc(p.hours)}</div>` : ""}
    <div style="margin-top:4px">${esc(p.why || "")}</div>
    <div style="margin-top:4px;color:#888">${esc(distTxt(p))}</div>
    <button class="popbtn" data-toggle="${p.id}">${isDone(p.id) ? "↩︎ Décocher" : "✔︎ Cocher"}</button>
    <a style="margin-left:8px" target="_blank" rel="noopener" href="${gmaps(p)}">Itinéraire</a>`;
}
function drawMarkers() {
  for (const p of PLACES) {
    if (p.lat == null) continue;
    const show = state.mapCat === "all" || state.mapCat === p.cat || (state.mapCat === "todo" && !isDone(p.id))
      || (state.mapCat.startsWith("d:") && p.days && p.days.includes(state.mapCat.slice(2)));
    const color = isDone(p.id) ? css("--done") : css(CAT[p.cat].color);
    if (!markers[p.id]) {
      markers[p.id] = L.circleMarker([p.lat, p.lon], { radius: 8, weight: 2, fillOpacity: .85 })
        .bindPopup(() => popupHtml(p));
    }
    const m = markers[p.id];
    m.setStyle({ color: "#fff", fillColor: color, radius: isDone(p.id) ? 6 : 8 });
    if (show && !map.hasLayer(m)) m.addTo(map);
    if (!show && map.hasLayer(m)) map.removeLayer(m);
  }
}
map.on("popupopen", e => {
  const b = e.popup.getElement().querySelector("[data-toggle]");
  if (b) b.onclick = () => { toggle(b.dataset.toggle); map.closePopup(); };
});
function drawMapFilters() {
  const opts = [["all", "Tout"], ["todo", "À faire"], ["bar", "🍺"], ["food", "🍟"], ["party", "🎉"], ["visit", "🏛️"],
    ...DAYS.map(d => ["d:" + d.id, d.label])];
  $("#mapFilters").innerHTML = opts.map(([v, l]) =>
    `<button data-f="${v}" class="${state.mapCat === v ? "active" : ""}">${l}</button>`).join("");
  $("#mapFilters").querySelectorAll("button").forEach(b => b.onclick = () => {
    state.mapCat = b.dataset.f; save(); drawMapFilters(); drawMarkers();
  });
}

// ── Listes ──
const gmaps = p => p.lat != null
  ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`
  : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + " Amsterdam")}`;
const gsearch = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ", " + (p.addr || "") + ", Amsterdam")}`;
const confHtml = c => !c ? "" : `<span class="conf ${c === "sûr" ? "s" : c === "probable" ? "p" : "v"}">${c}</span>`;
function card(p) {
  const srcs = (p.src || []).map(k => SRC[k]).filter(Boolean)
    .map(s => `<a target="_blank" rel="noopener" href="${s.u}">${esc(s.t)} (${esc(s.d)})</a>`).join(" · ");
  const days = (p.days || []).map(d => DAYS.find(x => x.id === d)?.label).filter(Boolean).join(", ");
  return `<div class="card ${isDone(p.id) ? "done" : ""}">
    <button class="check ${isDone(p.id) ? "on" : ""}" data-id="${p.id}" aria-label="Cocher">${isDone(p.id) ? "✔︎" : ""}</button>
    <div class="body">
      <h3><span class="dot" style="background:var(${CAT[p.cat].color})"></span>${esc(p.name)}${confHtml(p.conf)}</h3>
      <div class="meta">${esc(p.addr || "")}${p.approx ? " (approx.)" : ""}${days ? " · " + days : ""}</div>
      ${p.priceTxt ? `<div class="price">${esc(p.priceTxt)}</div>` : ""}
      ${p.hours ? `<div class="meta">🕘 ${esc(p.hours)}</div>` : ""}
      <div class="why">${esc(p.why || "")}</div>
      <div class="meta">${esc(distTxt(p))}</div>
      <div class="links">
        <a target="_blank" rel="noopener" href="${gmaps(p)}">🚶 Itinéraire</a>
        <a target="_blank" rel="noopener" href="${gsearch(p)}">🕘 Horaires (Maps)</a>
        ${p.lat != null ? `<a href="#" data-show="${p.id}">🗺️ Sur la carte</a>` : ""}
      </div>
      ${srcs ? `<div class="meta" style="margin-top:6px">Source : ${srcs}</div>` : ""}
    </div></div>`;
}
function bindCards(root) {
  root.querySelectorAll(".check").forEach(b => b.onclick = () => toggle(b.dataset.id));
  root.querySelectorAll("[data-show]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const p = PLACES.find(x => x.id === a.dataset.show);
    show("mapView"); map.setView([p.lat, p.lon], 17); markers[p.id].openPopup();
  });
}
function listView(el, cat, intro, sort) {
  const items = PLACES.filter(p => p.cat === cat).sort(sort);
  el.innerHTML = `<p class="note">${intro}</p>` + items.map(card).join("");
  bindCards(el);
}
const byPrice = (a, b) => (a.price ?? 99) - (b.price ?? 99) || byDist(a, b);

function renderBars() {
  const el = $("#barsView");
  const sortMode = state.barSort || "price";
  el.innerHTML = `<div class="filters">
      <button data-s="price" class="${sortMode === "price" ? "active" : ""}">Moins cher d'abord</button>
      <button data-s="dist" class="${sortMode === "dist" ? "active" : ""}">Plus proche d'abord</button></div>
    <p class="note">Prix d'un petit verre de pression (25 cl sauf mention), tels que publiés. Les prix de 2023 ont probablement pris 0,30 à 0,80 € depuis. Aucune base de prix fiable bar par bar n'existe : les sources sont des guides étudiants et locaux, cliquables sous chaque bar.</p>`;
  const items = PLACES.filter(p => p.cat === "bar").sort(sortMode === "price" ? byPrice : byDist);
  el.insertAdjacentHTML("beforeend", items.map(card).join(""));
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { state.barSort = b.dataset.s; save(); renderBars(); });
  bindCards(el);
}
function renderParties() {
  const el = $("#partyView");
  let html = `<p class="note">Les programmes du 27 au 30 octobre ne sont pas tous publiés. « sûr » : sur l'agenda officiel de la salle. « à vérifier » : listé ailleurs ou en contradiction. Vérifiez la veille sur <a target="_blank" rel="noopener" href="https://ra.co/events/nl/amsterdam">Resident Advisor</a>.</p>`;
  for (const d of DAYS) {
    const items = PLACES.filter(p => p.cat === "party" && p.days.includes(d.id)).sort(byDist);
    html += `<h2>${d.label}</h2>` + (items.length ? items.map(card).join("") : `<div class="empty">Rien de daté trouvé.</div>`);
  }
  html += `<h2>Tous les soirs</h2>` + PLACES.filter(p => ["b-alto", "b-vrankrijk", "b-kuil"].includes(p.id)).map(card).join("");
  el.innerHTML = html; bindCards(el);
}
function renderDays() {
  const el = $("#daysView");
  let html = `<p class="note">Rien le matin. Tout est regroupé par quartier pour ne pas traverser la ville deux fois dans la même journée.</p>`;
  for (const d of DAYS) {
    const items = PLACES.filter(p => (p.days || []).includes(d.id));
    const done = items.filter(p => isDone(p.id)).length;
    html += `<h2>${d.label} · ${done}/${items.length}</h2><p class="note">${d.theme}</p>`;
    for (const c of ["visit", "food", "bar", "party"]) {
      const sub = items.filter(p => p.cat === c);
      if (sub.length) html += sub.map(card).join("");
    }
  }
  const extra = PLACES.filter(p => !p.days || !p.days.length);
  html += `<h2>Bonus, si vous avez le temps</h2>` + extra.map(card).join("");
  html += `<h2>Réglages GPS</h2><div class="settings">
    <label>Rayon de détection
      <select id="setRadius">${[25, 40, 60, 100].map(v => `<option ${state.radius === v ? "selected" : ""} value="${v}">${v} m</option>`).join("")}</select></label>
    <label>Temps sur place avant de cocher
      <select id="setDwell">${[[0, "immédiat"], [60, "1 min"], [180, "3 min"], [300, "5 min"]].map(([v, l]) => `<option ${state.dwell === v ? "selected" : ""} value="${v}">${l}</option>`).join("")}</select></label>
    <p class="note">Le temps sur place évite de cocher tous les bars du Zeedijk en passant devant.</p>
    <button id="resetAll" type="button">Tout décocher</button></div>`;
  el.innerHTML = html; bindCards(el);
  $("#setRadius").onchange = e => { state.radius = +e.target.value; save(); };
  $("#setDwell").onchange = e => { state.dwell = +e.target.value; save(); };
  $("#resetAll").onclick = () => { if (confirm("Tout décocher ?")) { state.checked = {}; save(); renderAll(); } };
}
function renderProgress() {
  const all = PLACES.filter(p => p.lat != null || p.cat === "visit");
  $("#progress").textContent = `${all.filter(p => isDone(p.id)).length}/${all.length} ✔︎`;
}
function renderAll() {
  drawMarkers(); renderProgress();
  renderBars();
  listView($("#foodView"), "food", "Classé du moins cher au plus cher. Le supermarché reste la plus grosse économie de la semaine : petit-déjeuner et apéro avant de sortir.", byPrice);
  renderParties();
  listView($("#visitView"), "visit", "À réserver maintenant : Rijksmuseum ou Van Gogh (mercredi), Rederij Lampedusa (vendredi). Classé du plus proche au plus loin.", byDist);
  renderDays();
}

// ── Onglets ──
function show(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === v));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  if (v === "mapView") setTimeout(() => map.invalidateSize(), 50);
  else if (me) { renderAll(); document.getElementById(v).scrollTop = 0; } // distances recalculées depuis votre position
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.v));

// ── GPS : coche automatique quand on reste près d'un lieu ──
let watchId = null;
const inside = {}; // id -> heure d'entrée dans le rayon
function onPos(pos) {
  const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
  const first = !me;
  me = { lat, lon, acc };
  if (!meMarker) {
    meCircle = L.circle([lat, lon], { radius: acc, color: "#2563eb", weight: 1, fillOpacity: .1 }).addTo(map);
    meMarker = L.circleMarker([lat, lon], { radius: 7, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
  } else { meMarker.setLatLng([lat, lon]); meCircle.setLatLng([lat, lon]).setRadius(acc); }
  if (first) map.setView([lat, lon], 16);
  $("#gpsInfo").textContent = `GPS actif · précision ±${Math.round(acc)} m`;
  if (acc > 100) return; // signal trop imprécis pour cocher quoi que ce soit
  const now = Date.now();
  for (const p of PLACES) {
    if (p.lat == null || isDone(p.id)) continue;
    const d = dist(lat, lon, p.lat, p.lon);
    if (d <= state.radius + Math.min(acc, 30) + (p.approx ? 40 : 0)) {
      inside[p.id] = inside[p.id] || now;
      if (now - inside[p.id] >= state.dwell * 1000) {
        toggle(p.id, true);
        toast(`✔︎ Visité : ${p.name}`);
        if (navigator.vibrate) navigator.vibrate(200);
      }
    } else delete inside[p.id];
  }
  renderProgress();
}
function onErr(e) {
  const msg = { 1: "GPS refusé : autorisez la localisation pour ce site dans les réglages du navigateur.", 2: "Position introuvable.", 3: "GPS trop lent." }[e.code] || e.message;
  $("#gpsInfo").textContent = msg; toast(msg);
  if (e.code === 1) stopGps();
}
function startGps() {
  if (!("geolocation" in navigator)) { toast("Pas de GPS sur ce navigateur"); return; }
  if (!window.isSecureContext) { toast("Le GPS demande une adresse https://"); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  $("#gpsBtn").classList.add("on"); $("#gpsBtn").textContent = "📍 GPS on";
  $("#gpsInfo").textContent = "Recherche de la position…";
  state.gps = true; save();
}
function stopGps() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; $("#gpsBtn").classList.remove("on"); $("#gpsBtn").textContent = "📍 GPS";
  $("#gpsInfo").textContent = "GPS arrêté"; state.gps = false; save();
}
$("#gpsBtn").onclick = () => watchId == null ? startGps() : stopGps();
// Le navigateur ne suit la position que quand la page est ouverte : on relance au retour.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.gps && watchId == null) startGps();
});

drawMapFilters();
renderAll();
if (state.gps) startGps();

if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
